   Tenta usar localStorage; se o ambiente bloquear (ex.: visual-
   ização em sandbox), usa memória volátil sem quebrar o app.
   ============================================================ */
const memoryStore = {};
const store = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return key in memoryStore ? memoryStore[key] : fallback;
    }
  },
  set(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { memoryStore[key] = value; }
  },
};

/* ============================================================

function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = '';
    try {
      const lib = window.lucide;
      const node = lib && ((lib.icons && lib.icons[name]) || lib[name]);
      if (lib && typeof lib.createElement === 'function' && node) {
        const el = lib.createElement(node);
        el.setAttribute('width', size);
        el.setAttribute('height', size);
        el.setAttribute('stroke-width', strokeWidth);
        ref.current.appendChild(el);
      } else {
        ref.current.textContent = '·';
      }
    } catch (e) { ref.current.textContent = '·'; }
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={'inline-flex items-center justify-center shrink-0 ' + className} aria-hidden="true"></span>;
}

/* ============================================================
   MOTOR DE ÁUDIO ZEN (Web Audio API pura, 100% sintético)
   Ruído rosa/marrom filtrado com oscilações lentas (LFO).
   ============================================================ */
const ZenAudio = (() => {
  let ctx = null;
  let nodes = null;

  function makeNoiseBuffer(type) {
    const length = ctx.sampleRate * 4;
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    if (type === 'brown') {
      let last = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.5;
      }
    } else {
      // Ruído rosa (algoritmo de Paul Kellet)
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
        b6 = white * 0.115926;
      }
    }
    return buffer;
  }

  const PRESETS = {
    chuva:    { noise: 'pink',  filterType: 'bandpass', freq: 1400, q: 0.6, lfoRate: 0.35, lfoDepth: 0.10, gain: 0.30 },
    floresta: { noise: 'pink',  filterType: 'lowpass',  freq: 900,  q: 0.8, lfoRate: 0.15, lfoDepth: 0.14, gain: 0.26 },
    ondas:    { noise: 'brown', filterType: 'lowpass',  freq: 480,  q: 0.7, lfoRate: 0.07, lfoDepth: 0.45, gain: 0.34 },
  };

  function stop() {
    if (nodes) {
      try {
        nodes.master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
        const old = nodes;
        setTimeout(() => { try { old.src.stop(); old.lfo.stop(); } catch (e) {} }, 500);
      } catch (e) {}
      nodes = null;
    }
  }

  function play(presetName) {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    stop();
    const p = PRESETS[presetName];
    const src = ctx.createBufferSource();
    src.buffer = makeNoiseBuffer(p.noise);
    src.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = p.filterType;
    filter.frequency.value = p.freq;
    filter.Q.value = p.q;

    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(p.gain, ctx.currentTime + 1.2);

    // LFO: respiração lenta do som (ondas que vêm e vão)
    const lfo = ctx.createOscillator();
    lfo.frequency.value = p.lfoRate;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = p.gain * p.lfoDepth * 3;
    lfo.connect(lfoGain);
    lfoGain.connect(master.gain);

    src.connect(filter);
    filter.connect(master);
    master.connect(ctx.destination);
    src.start();
    lfo.start();
    nodes = { src, filter, master, lfo };
  }

  return { play, stop };
})();

      // Modo demonstração: resposta empática local quando a API não responde
      const fallback = RESPOSTAS_FALLBACK[Math.floor(Math.random() * RESPOSTAS_FALLBACK.length)];
      setChat((c) => [...c, { role: 'model', text: fallback }]);
    } finally {
      setDigitando(false);
    }
  }

  function toggleSom(nome) {
    if (somAtivo === nome) { ZenAudio.stop(); setSomAtivo(null); }
    else { ZenAudio.play(nome); setSomAtivo(nome); }
  }

  const sons = [
    { id: 'chuva', label: 'Chuva', icone: 'CloudRain' },
    { id: 'floresta', label: 'Floresta', icone: 'Trees' },
    { id: 'ondas', label: 'Ondas do Mar', icone: 'Waves' },
  ];

  return (
    <div>
      <SectionHeader icon="Brain" eyebrow="Espaço Zen" title="Chat cognitivo e descompressão"
        subtitle="Converse com o assistente de acolhimento e use o guia de respiração com sons ambientes gerados em tempo real." />

      <div className="grid grid-cols-1 xl:grid-cols-5 gap-6">
        {/* Chat */}
        <div className="xl:col-span-3 glass rounded-2xl shadow-glass flex flex-col overflow-hidden" style={{ height: '620px' }}>
          <div className="bg-amber-50/90 border-b border-amber-200 px-4 py-2.5 flex items-start gap-2">
            <Icon name="AlertTriangle" size={16} className="text-amber-600 mt-0.5" />
            <p className="text-xs text-amber-800 leading-snug">
              <strong>Atenção:</strong> este é um protótipo de demonstração. O atendimento está sendo
              realizado por uma Inteligência Artificial simulando um psicólogo humano.
            </p>
          </div>

          <div className="flex items-center gap-3 px-4 py-3 border-b border-slate-100/80">
            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-teal-500 flex items-center justify-center text-white">
              <Icon name="Sparkles" size={18} />
            </div>
            <div>
              <p className="font-semibold text-sm text-slate-800">Psicólogo</p>
              <p className="text-xs text-emerald-600 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Disponível agora
              </p>
            </div>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
            {chat.length === 0 && (
              <div className="text-center text-slate-400 text-sm mt-16 px-8">
                <Icon name="MessageCircle" size={34} className="mx-auto mb-3 text-teal-300" />
                Este é um espaço seguro. Escreva o que estiver sentindo hoje: ansiedade,
                cansaço, uma conquista ou apenas um desabafo.
              </div>
            )}
            {chat.map((m, i) => <BolhaMensagem key={i} msg={m} />)}
            {digitando && (
              <div className="flex items-center gap-2 text-slate-500 text-xs pl-1">
                <div className="bg-white/90 border border-slate-100 rounded-2xl rounded-bl-md px-4 py-3 flex gap-1.5">
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block" style={{ animationDelay: '0s' }}></span>
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block" style={{ animationDelay: '.2s' }}></span>
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block" style={{ animationDelay: '.4s' }}></span>
                </div>
                Psicólogo está digitando...
              </div>
            )}
          </div>

          <div className="p-3 border-t border-slate-100/80 flex gap-2">
            <input
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && enviar()}
              placeholder="Escreva sua mensagem..."
              className="flex-1 bg-white/80 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 transition-all duration-300"
            />
            <button onClick={enviar} disabled={digitando}
              className="bg-gradient-to-br from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 disabled:opacity-50 text-white rounded-2xl px-4 flex items-center justify-center transition-all duration-300 ease-in-out shadow-glow">
              <Icon name="Send" size={18} />
            </button>
          </div>
        </div>

        {/* Mini Espaço Zen */}
        <div className="xl:col-span-2 flex flex-col gap-6">
          <div className="glass rounded-2xl shadow-glass p-6 flex flex-col items-center">
            <p className="text-xs font-semibold uppercase tracking-widest text-teal-600 mb-6 flex items-center gap-2">
              <Icon name="Wind" size={14} /> Guia de respiração 4-4-4
            </p>
            <div className="relative w-44 h-44 flex items-center justify-center my-2">
              <div className="breathe-circle absolute inset-0 rounded-full bg-gradient-to-br from-teal-300 via-emerald-300 to-indigo-300 opacity-90"></div>
              <div className="relative z-10 w-24 h-24 rounded-full bg-white/85 backdrop-blur flex items-center justify-center shadow-lg">
                <span className="font-display font-semibold text-teal-700 text-sm" aria-live="polite">{faseRespiracao}</span>
              </div>
            </div>
            <p className="text-xs text-slate-400 mt-5 text-center">Acompanhe o círculo: 4s inspirando, 4s segurando, 4s expirando.</p>
          </div>

          <div className="glass rounded-2xl shadow-glass p-6">
            <p className="text-xs font-semibold uppercase tracking-widest text-teal-600 mb-4 flex items-center gap-2">
              <Icon name="Music4" size={14} /> Sons ambientes sintéticos
            </p>
            <div className="grid grid-cols-3 gap-3">
              {sons.map((s) => (
                <button key={s.id} onClick={() => toggleSom(s.id)}
                  className={
                    'rounded-2xl p-3 flex flex-col items-center gap-2 border transition-all duration-300 ease-in-out ' +
                    (somAtivo === s.id
                      ? 'bg-gradient-to-br from-teal-500 to-emerald-600 text-white border-transparent shadow-glow scale-[1.03]'
                      : 'bg-white/70 border-slate-200 text-slate-600 hover:border-teal-300 hover:-translate-y-0.5')
                  }>
                  <Icon name={somAtivo === s.id ? 'Pause' : s.icone} size={20} />
                  <span className="text-[11px] font-medium">{s.label}</span>
                </button>
              ))}
            </div>
            <div className="h-12 mt-5 flex items-end justify-center gap-1.5" aria-hidden="true">
              {[...Array(14)].map((_, i) => (
                <span key={i}
                  className={'eq-bar w-1.5 rounded-full bg-gradient-to-t from-teal-500 to-emerald-300 transition-all duration-300 ' + (somAtivo ? 'opacity-100' : 'opacity-20')}
                  style={{ height: (18 + (i % 5) * 8) + 'px', animationDelay: (i * 0.09) + 's', animationPlayState: somAtivo ? 'running' : 'paused' }}>
                </span>
              ))}
            </div>
            <p className="text-[11px] text-slate-400 text-center mt-2">
              {somAtivo ? 'Gerando ruído filtrado em tempo real (Web Audio API).' : 'Toque em um som para iniciar.'}
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   3. ESCUTA BLINDADA (Canal de ouvidoria)
   ============================================================ */
function EscutaBlindada({ addDenuncia, usuario, mostrarToast }) {
  const [texto, setTexto] = useState('');
  const [anonima, setAnonima] = useState(true);
  const MAX = 2000;

  function enviar() {
    if (!texto.trim()) return;
    addDenuncia({
      id: Date.now(),
      texto: texto.trim(),
      anonima,
      autor: anonima ? null : { nome: usuario.nome, foto: usuario.foto, setor: usuario.setor },
      timestamp: new Date().toISOString(),
      status: 'pendente',
    });
    setTexto('');
    mostrarToast('Denúncia enviada com sucesso');
  }

  return (
    <div className="max-w-3xl">
      <SectionHeader icon="ShieldCheck" eyebrow="Escuta Blindada" title="Canal seguro de ouvidoria"
        subtitle="Relate assédio, sobrecarga, conflitos ou qualquer situação que afete sua saúde no trabalho." />

      <div className="glass rounded-2xl shadow-glass p-6 fade-up">
        <div className="flex items-start gap-3 bg-indigo-50/80 border border-indigo-100 rounded-2xl p-4 mb-5">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-teal-500 flex items-center justify-center text-white shrink-0">
            <Icon name="ShieldCheck" size={20} />
          </div>
          <p className="text-sm text-indigo-900/80 leading-relaxed">
            <strong className="text-indigo-900">Fique tranquilo.</strong> Esta mensagem é criptografada
            de ponta a ponta e enviada exclusivamente para o painel do Administrador do sistema.
            Nenhum líder direto tem acesso ao conteúdo.
          </p>
        </div>

        <label className="block text-sm font-medium text-slate-700 mb-2" htmlFor="desabafo">Seu relato</label>
        <textarea
          id="desabafo"
          value={texto}
          maxLength={MAX}
          onChange={(e) => setTexto(e.target.value)}
          rows={7}
          placeholder="Descreva a situação com o máximo de detalhes que se sentir confortável em compartilhar..."
          className="w-full bg-white/80 border border-slate-200 rounded-2xl p-4 text-sm outline-none resize-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 transition-all duration-300"
        ></textarea>
        <div className="flex justify-end mt-1">
          <span className={'text-xs ' + (texto.length > MAX * 0.9 ? 'text-amber-600 font-medium' : 'text-slate-400')}>
            {texto.length} / {MAX} caracteres
          </span>
        </div>

        <label className="flex items-center gap-3 mt-4 cursor-pointer select-none group">
          <input type="checkbox" checked={anonima} onChange={(e) => setAnonima(e.target.checked)}
            className="w-5 h-5 rounded-md accent-teal-600 cursor-pointer" />
          <span className="text-sm text-slate-700 group-hover:text-slate-900 transition-colors duration-300">
            Deseja enviar esta denúncia de forma <strong>100% Anônima</strong>?
          </span>
        </label>

        <div className="flex items-center justify-between mt-6 flex-wrap gap-3">
          <p className="text-xs text-slate-400 flex items-center gap-1.5">
            <Icon name="Lock" size={13} />
            {anonima ? 'Sua identidade será totalmente ocultada.' : 'Seu nome (' + usuario.nome + ') será exibido ao administrador.'}
          </p>
          <button onClick={enviar} disabled={!texto.trim()}
            className="bg-gradient-to-br from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-2xl px-6 py-3 flex items-center gap-2 transition-all duration-300 ease-in-out shadow-glow hover:-translate-y-0.5">
            <Icon name="Send" size={16} /> Enviar desabafo
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   4. FORMULÁRIO DE CLIMA E SAÚDE MENTAL
   ============================================================ */
function FormularioClima({ clima, setClima }) {
  const [respostas, setRespostas] = useState(clima.respostas || {});
  const completo = PERGUNTAS_CLIMA.every((p) => respostas[p.id]);

  function calcular() {
    // Índice de sobrecarga: 0% (saudável) a 100% (crítico)
    let pontos = 0;
    PERGUNTAS_CLIMA.forEach((p) => {
      const v = respostas[p.id];
      pontos += p.invertida ? 6 - v : v; // normaliza: maior = mais sobrecarga
    });
    const indice = Math.round(((pontos - 6) / 24) * 100);
    setClima({ respostas, indice, enviado: true });
  }

  function refazer() {
    setRespostas({});
    setClima({ respostas: {}, indice: null, enviado: false });
  }

  if (clima.enviado) {
    const indice = clima.indice;
    const raio = 84;
    const circ = 2 * Math.PI * raio;
    const offset = circ - (indice / 100) * circ;
    const nivel =
      indice >= 67
        ? {
            cor: '#ef4444', corSuave: 'bg-red-50 border-red-100', titulo: 'Alerta: risco elevado de burnout',
            texto: 'Suas respostas indicam sobrecarga mental crítica. Recomendação imediata: agende uma conversa confidencial com o psicólogo corporativo ainda esta semana, bloqueie pausas de 10 minutos a cada 90 minutos de trabalho e comunique ao seu gestor a necessidade de repriorizar entregas. Você não precisa atravessar isso sozinho.',
            icone: 'Siren',
          }
        : indice >= 34
        ? {
            cor: '#f59e0b', corSuave: 'bg-amber-50 border-amber-100', titulo: 'Pontos de atenção no cotidiano',
            texto: 'Há sinais moderados de desgaste. Sugestões práticas: use o guia de respiração do Espaço Zen duas vezes ao dia, defina um horário fixo para encerrar o expediente nesta semana e converse com sua liderança sobre o volume de tarefas antes que ele se acumule.',
            icone: 'AlertTriangle',
          }
        : {
            cor: '#10b981', corSuave: 'bg-emerald-50 border-emerald-100', titulo: 'Excelente saúde psicossocial',
            texto: 'Seus indicadores estão saudáveis. Para manter: preserve seus rituais de pausa, continue registrando seu humor diário no perfil e compartilhe boas práticas com colegas. Prevenção contínua é o melhor tratamento.',
            icone: 'HeartPulse',
          };

    return (
      <div className="max-w-3xl">
        <SectionHeader icon="ClipboardList" eyebrow="Diagnóstico" title="Resultado da sua avaliação"
          subtitle="Análise gerada a partir das suas 6 respostas na escala psicossocial." />
        <div className="glass rounded-2xl shadow-glass p-8 flex flex-col items-center fade-up">
          <div className="relative w-56 h-56">
            <svg viewBox="0 0 200 200" className="w-full h-full -rotate-90">
              <circle cx="100" cy="100" r={raio} fill="none" stroke="#e2e8f0" strokeWidth="14" />
              <circle cx="100" cy="100" r={raio} fill="none" stroke={nivel.cor} strokeWidth="14"
                strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={offset} className="ring-progress" />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="font-display text-5xl font-extrabold" style={{ color: nivel.cor }}>{indice}%</span>
              <span className="text-[11px] uppercase tracking-widest text-slate-400 mt-1 text-center px-8">Índice de sobrecarga mental</span>
            </div>
          </div>

          <div className={'mt-8 rounded-2xl border p-5 w-full ' + nivel.corSuave}>
            <h3 className="font-display font-bold text-slate-800 flex items-center gap-2 mb-2">
              <Icon name={nivel.icone} size={20} /> {nivel.titulo}
            </h3>
            <p className="text-sm text-slate-600 leading-relaxed">{nivel.texto}</p>
          </div>

          <button onClick={refazer}
            className="mt-6 text-sm font-medium text-teal-700 hover:text-teal-500 flex items-center gap-2 transition-all duration-300">
            <Icon name="RefreshCw" size={15} /> Refazer avaliação
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-3xl">
      <SectionHeader icon="ClipboardList" eyebrow="Clima organizacional" title="Avaliação de clima e saúde mental"
        subtitle="Responda com sinceridade. Ao final, você recebe um diagnóstico visual com orientações práticas." />

      <div className="space-y-4">
        {PERGUNTAS_CLIMA.map((p, idx) => (
          <div key={p.id} className="glass rounded-2xl shadow-glass p-5 fade-up" style={{ animationDelay: (idx * 0.05) + 's' }}>
            <p className="text-sm font-medium text-slate-700 mb-4">
              <span className="text-teal-600 font-display font-bold mr-2">{String(p.id).padStart(2, '0')}</span>
              {p.texto}
            </p>
            <div className="flex items-center gap-2 md:gap-3">
              <span className="text-[10px] text-slate-400 w-16 text-right hidden sm:block">{p.min}</span>
              <div className="flex-1 grid grid-cols-5 gap-2">
                {[1, 2, 3, 4, 5].map((v) => (
                  <button key={v} onClick={() => setRespostas({ ...respostas, [p.id]: v })}
                    className={
                      'h-11 rounded-2xl font-display font-semibold text-sm border transition-all duration-300 ease-in-out ' +
                      (respostas[p.id] === v
                        ? 'bg-gradient-to-br from-teal-500 to-emerald-600 text-white border-transparent shadow-glow scale-[1.05]'
                        : 'bg-white/70 border-slate-200 text-slate-500 hover:border-teal-300 hover:-translate-y-0.5')
                    }>
                    {v}
                  </button>
                ))}
              </div>
              <span className="text-[10px] text-slate-400 w-16 hidden sm:block">{p.max}</span>
            </div>
          </div>
        ))}
      </div>

      <div className="flex items-center justify-between mt-6 flex-wrap gap-3">
        <p className="text-xs text-slate-400">
          {Object.keys(respostas).length} de {PERGUNTAS_CLIMA.length} respondidas
        </p>
        <button onClick={calcular} disabled={!completo}
          className="bg-gradient-to-br from-indigo-500 to-teal-600 hover:from-indigo-400 hover:to-teal-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-2xl px-7 py-3 flex items-center gap-2 transition-all duration-300 ease-in-out shadow-glow hover:-translate-y-0.5">
          <Icon name="Gauge" size={16} /> Enviar e gerar diagnóstico
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   5. PERFIL PESSOAL (Dashboard do colaborador)
   ============================================================ */
const HUMORES = [
  { id: 'excelente', label: 'Excelente', emoji: '🟢', cor: 'bg-emerald-500' },
  { id: 'bom', label: 'Bom', emoji: '🟡', cor: 'bg-yellow-400' },
  { id: 'ansioso', label: 'Ansioso', emoji: '🔵', cor: 'bg-blue-500' },
  { id: 'estressado', label: 'Estressado', emoji: '🔴', cor: 'bg-red-500' },
];

function Perfil({ usuario, humores, setHumores, metas, setMetas }) {
  const hoje = new Date();
  const ano = hoje.getFullYear();
  const mes = hoje.getMonth();
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const [diaSelecionado, setDiaSelecionado] = useState(hoje.getDate());
  const [fotoErro, setFotoErro] = useState(false);

  function chaveDia(d) { return ano + '-' + (mes + 1) + '-' + d; }

  function registrarHumor(humorId) {
    setHumores({ ...humores, [chaveDia(diaSelecionado)]: humorId });
  }

  function avancarMeta(idx) {
    setMetas(metas.map((m, i) =>
      i === idx ? { ...m, feito: Math.min(m.feito + 1, m.total) } : m
    ));
  }

  return (
    <div>
      <SectionHeader icon="User" eyebrow="Meu espaço" title="Perfil pessoal"
        subtitle="Acompanhe seu humor, suas metas de bem-estar e seu histórico de consultas." />

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* Card de perfil */}
        <div className="glass rounded-2xl shadow-glass p-6 fade-up">
          <div className="h-20 rounded-2xl bg-gradient-to-r from-teal-400 via-emerald-400 to-indigo-400 mb-[-2.5rem]"></div>
          <div className="flex flex-col items-center text-center">
            {fotoErro ? (
              <div className="w-20 h-20 rounded-2xl border-4 border-white shadow-lg bg-gradient-to-br from-teal-500 to-indigo-500 flex items-center justify-center text-white font-display font-bold text-2xl">
                {usuario.nome.split(' ').map((n) => n[0]).slice(0, 2).join('')}

          </p>

              const dia = i + 1;
              const humor = HUMORES.find((h) => h.id === humores[chaveDia(dia)]);
              const ehHoje = dia === hoje.getDate();
              const futuro = dia > hoje.getDate();
              const selecionado = dia === diaSelecionado;
              return (
                <button key={dia} disabled={futuro} onClick={() => setDiaSelecionado(dia)}
                  className={
                    'aspect-square rounded-xl text-xs font-medium flex items-center justify-center transition-all duration-300 ease-in-out ' +
                    (humor ? humor.cor + ' text-white shadow-sm ' : 'bg-white/70 border border-slate-100 text-slate-500 ') +
                    (futuro ? 'opacity-30 cursor-not-allowed ' : 'hover:scale-110 ') +
                    (selecionado ? 'ring-2 ring-teal-500 ring-offset-1 ' : '') +

                  }>
                  {dia}

              );

          <p className="text-xs text-slate-500 mt-5 mb-2">

          <div className="grid grid-cols-2 gap-2">
            {HUMORES.map((h) => {
              const ativo = humores[chaveDia(diaSelecionado)] === h.id;
              return (
                <button key={h.id} onClick={() => registrarHumor(h.id)}
                  className={
                    'rounded-2xl px-3 py-2.5 text-xs font-medium flex items-center gap-2 border transition-all duration-300 ease-in-out ' +

          <div className="space-y-5">
            {metas.map((m, idx) => {
              const pct = Math.round((m.feito / m.total) * 100);
              const completa = m.feito >= m.total;
              return (
                <div key={idx}>
                  <div className="flex items-center justify-between mb-1.5">
                    <p className="text-sm text-slate-700 font-medium flex items-center gap-2">
                      <Icon name={m.icone} size={15} className="text-teal-600" /> {m.titulo}
                    </p>
                    <span className={'text-xs font-semibold ' + (completa ? 'text-emerald-600' : 'text-slate-400')}>
                      {m.feito}/{m.total}

                  <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden">
                    <div className={'h-full rounded-full transition-all duration-500 ease-out ' + (completa ? 'bg-gradient-to-r from-emerald-400 to-teal-500' : 'bg-gradient-to-r from-teal-400 to-indigo-400')}
                      style={{ width: pct + '%' }}></div>
                  </div>
                  {!completa && (
                    <button onClick={() => avancarMeta(idx)}
                      className="mt-1.5 text-[11px] font-medium text-teal-600 hover:text-teal-500 transition-colors duration-300">
                      + Registrar progresso

                  {completa && (
                    <p className="mt-1.5 text-[11px] font-medium text-emerald-600 flex items-center gap-1">

                  )}
                </div>

          <div className="mt-6 rounded-2xl bg-gradient-to-br from-indigo-500/95 to-teal-600/95 p-4 text-white">
            <p className="text-xs uppercase tracking-widest opacity-80 mb-1">Sequência de autocuidado</p>
            <p className="font-display font-extrabold text-2xl">7 dias 🔥</p>
            <p className="text-xs opacity-80 mt-1">Você registrou humor ou fez uma pausa zen por 7 dias seguidos.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

const SPRINTS = [
  { sprint: 'S1', humor: 72, entregas: 18 },
  { sprint: 'S2', humor: 68, entregas: 21 },
  { sprint: 'S3', humor: 61, entregas: 24 },
  { sprint: 'S4', humor: 55, entregas: 26 },
  { sprint: 'S5', humor: 49, entregas: 22 },
  { sprint: 'S6', humor: 58, entregas: 19 },
  { sprint: 'S7', humor: 66, entregas: 23 },
  { sprint: 'S8', humor: 71, entregas: 27 },
];

const BURNOUT_SETORES = [
  { setor: 'TI', valor: 78, cor: '#ef4444' },
  { setor: 'Vendas', valor: 55, cor: '#f59e0b' },
  { setor: 'Financeiro', valor: 51, cor: '#f59e0b' },
  { setor: 'RH', valor: 28, cor: '#10b981' },
];

function GraficoLinhas() {
  const W = 640, H = 260, PAD = 44;
  const [hover, setHover] = useState(null);
  const passoX = (W - PAD * 2) / (SPRINTS.length - 1);

  function y(valor, max) { return H - PAD - (valor / max) * (H - PAD * 2); }
  const pontosFel = SPRINTS.map((s, i) => [PAD + i * passoX, y(s.felicidade, 100)]);
  const pontosEnt = SPRINTS.map((s, i) => [PAD + i * passoX, y(s.entregas, 30)]);
  const linha = (pts) => pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
  const area = (pts) => linha(pts) + ' L' + pts[pts.length - 1][0] + ',' + (H - PAD) + ' L' + pts[0][0] + ',' + (H - PAD) + ' Z';

  return (
    <div className="glass rounded-2xl shadow-glass p-6 fade-up">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-4">
        <div>
          <p className="text-xs font-semibold uppercase tracking-widest text-teal-600">Correlação por sprint</p>
          <h3 className="font-display font-bold text-slate-800">Humor da equipe vs. Entregas</h3>
        </div>
        <div className="flex items-center gap-4 text-xs text-slate-500">
          <span className="flex items-center gap-1.5"><span className="w-3 h-1.5 rounded-full bg-teal-500 inline-block"></span> Humor (%)</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-1.5 rounded-full bg-indigo-500 inline-block"></span> Entregas (itens)</span>
        </div>
      </div>

      <svg viewBox={'0 0 ' + W + ' ' + H} className="w-full h-auto select-none">
        <defs>
          <linearGradient id="gradFel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#14b8a6" stopOpacity="0.25" />
            <stop offset="100%" stopColor="#14b8a6" stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0, 25, 50, 75, 100].map((g) => (
          <g key={g}>
            <line x1={PAD} x2={W - PAD} y1={y(g, 100)} y2={y(g, 100)} stroke="#e2e8f0" strokeDasharray="4 5" />
            <text x={PAD - 8} y={y(g, 100) + 4} textAnchor="end" fontSize="10" fill="#94a3b8">{g}</text>
          </g>
        ))}
        <path d={area(pontosFel)} fill="url(#gradFel)" />
        <path d={linha(pontosFel)} fill="none" stroke="#14b8a6" strokeWidth="3" strokeLinecap="round" />
        <path d={linha(pontosEnt)} fill="none" stroke="#6366f1" strokeWidth="3" strokeLinecap="round" strokeDasharray="1 7" strokeLinejoin="round" />
        {SPRINTS.map((s, i) => (
          <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }}>
            <rect x={PAD + i * passoX - passoX / 2} y={PAD / 2} width={passoX} height={H - PAD} fill="transparent" />
            <circle cx={pontosFel[i][0]} cy={pontosFel[i][1]} r={hover === i ? 7 : 4.5} fill="#14b8a6" stroke="#fff" strokeWidth="2" style={{ transition: 'all .25s' }} />
            <circle cx={pontosEnt[i][0]} cy={pontosEnt[i][1]} r={hover === i ? 7 : 4.5} fill="#6366f1" stroke="#fff" strokeWidth="2" style={{ transition: 'all .25s' }} />
            <text x={pontosFel[i][0]} y={H - PAD + 18} textAnchor="middle" fontSize="10" fill="#64748b">{s.sprint}</text>
          </g>
        ))}
        {hover !== null && (
          <g style={{ pointerEvents: 'none' }}>
            <rect x={Math.min(Math.max(pontosFel[hover][0] - 62, 6), W - 130)} y={16} width="124" height="52" rx="12" fill="#0f172a" opacity="0.92" />
            <text x={Math.min(Math.max(pontosFel[hover][0], 68), W - 68)} y={36} textAnchor="middle" fontSize="11" fill="#5eead4" fontWeight="700">
              Felicidade: {SPRINTS[hover].felicidade}%
            </text>
            <text x={Math.min(Math.max(pontosFel[hover][0], 68), W - 68)} y={54} textAnchor="middle" fontSize="11" fill="#c7d2fe">
              Entregas: {SPRINTS[hover].entregas} itens
            </text>
          </g>
        )}
      </svg>
      <p className="text-[11px] text-slate-400 mt-2">
        Leitura: quando a humor caiu abaixo de 55% (S4-S5), o volume de entregas também recuou nas sprints seguintes.
      </p>
    </div>
  );
}

/* ============================================================
   8. PAINEL DE GESTÃO DE DENÚNCIAS (Exclusivo Admin)
   ============================================================ */
function PainelDenuncias({ role, denuncias, setDenuncias, mostrarToast }) {
  const [modal, setModal] = useState(null);
  const [resposta, setResposta] = useState('');
  if (role !== 'admin') return <AcessoNegado />;

  function marcarResolvida(id) {
    setDenuncias(denuncias.map((d) => (d.id === id ? { ...d, status: d.status === 'resolvida' ? 'pendente' : 'resolvida' } : d)));
  }

  function enviarResposta() {
    mostrarToast('Sindicância registrada e contato iniciado');
    setModal(null);
    setResposta('');
  }

  function formatarData(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) +
      ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  const pendentes = denuncias.filter((d) => d.status === 'pendente').length;

  return (
    <div className="max-w-4xl">
      <SectionHeader icon="Siren" eyebrow="Ouvidoria" title="Gestão de denúncias"
        subtitle={denuncias.length + ' registro(s) recebido(s) pela Escuta Blindada, sendo ' + pendentes + ' pendente(s) de triagem.'} />

      {denuncias.length === 0 && (
        <div className="glass rounded-2xl shadow-glass p-12 text-center fade-up">
          <Icon name="Inbox" size={38} className="text-teal-300 mx-auto mb-3" />
          <h3 className="font-display font-bold text-slate-700 mb-1">Nenhuma denúncia recebida</h3>
          <p className="text-sm text-slate-500">
            Quando um colaborador enviar um relato pela Escuta Blindada, ele aparecerá aqui em tempo real.
            Alterne para o perfil Colaborador e envie um relato para testar o fluxo.
          </p>
        </div>
      )}

      <div className="space-y-4">
        {denuncias.slice().reverse().map((d) => {
          const resolvida = d.status === 'resolvida';
          return (
            <article key={d.id}
              className={

          );
        })}
      </div>

      {/* Modal de sindicância */}
      {modal && (
        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-all duration-300" onClick={() => setModal(null)}></div>
          <div className="relative glass rounded-2xl shadow-2xl w-full max-w-lg p-6 toast-in">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-display font-bold text-slate-800 flex items-center gap-2">
                <Icon name="Gavel" size={18} className="text-indigo-600" /> Resposta corporativa

              <button onClick={() => setModal(null)} className="text-slate-400 hover:text-slate-700 transition-colors duration-300">
                <Icon name="X" size={20} />
              </button>

            <p className="text-xs text-slate-500 bg-slate-50 border border-slate-100 rounded-2xl p-3 mb-4 leading-relaxed">
              <strong>Protocolo #{String(modal.id).slice(-6)}</strong> | Destinatário:{' '}
              {modal.anonima ? 'canal anônimo criptografado (a identidade permanece oculta)' : modal.autor.nome}
            </p>
            <textarea
              value={resposta}
              onChange={(e) => setResposta(e.target.value)}
              rows={5}
              placeholder="Descreva as providências iniciais, o prazo de retorno e o convite para acompanhamento psicológico..."
              className="w-full bg-white/80 border border-slate-200 rounded-2xl p-4 text-sm outline-none resize-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all duration-300"
            ></textarea>
            <div className="flex justify-end gap-2 mt-4">
              <button onClick={() => setModal(null)}

                className="text-sm font-semibold bg-gradient-to-br from-indigo-500 to-teal-600 hover:from-indigo-400 hover:to-teal-500 disabled:opacity-40 text-white rounded-2xl px-5 py-2.5 flex items-center gap-2 transition-all duration-300">
                <Icon name="Send" size={15} /> Enviar resposta
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

Você é um consultor sênior de RH e saúde ocupacional, especializado em
mediação de conflitos, prevenção de assédio e gestão de riscos psicossociais.
Você vai receber o relato de uma denúncia interna (Escuta Blindada) e deve
propor um plano de ação para o time de RH/Administração.

Responda SOMENTE com um JSON válido (sem markdown, sem texto fora do JSON),
no seguinte formato exato:

{
  "urgencia": "baixa" | "media" | "alta",
  "resumo": "resumo objetivo da situação em até 2 frases",
  "acoes_imediatas": ["ação curta 1", "ação curta 2", "ação curta 3"],
  "investigacao": "recomendação de como conduzir a apuração, com cuidado e sigilo",
  "comunicacao_sugerida": "um parágrafo curto e empático para responder ao denunciante",
  "prevencao": "uma recomendação estrutural para reduzir recorrência"
}

Nunca acuse nomeadamente terceiros sem provas, nunca dê conselhos jurídicos
definitivos (apenas oriente buscar jurídico/compliance quando cabível), e
mantenha um tom profissional, empático e prático.
`.trim();

const SUGESTAO_FALLBACK = {
  urgencia: 'media',
  resumo: '',
  acoes_imediatas: [
    'Agendar escuta individual confidencial com o denunciante em até 48h',
    'Preservar o anonimato se solicitado, restringindo o acesso ao relato',
    'Registrar formalmente o caso no protocolo interno de ouvidoria',
  ],
  investigacao: 'Conduzir apuração discreta com pessoas de confiança de RH, ouvindo as partes envolvidas separadamente e sem expor a identidade do denunciante.',
  comunicacao_sugerida: 'Obrigado por compartilhar isso com a gente. Levamos sua mensagem a sério e já estamos avaliando os próximos passos com cuidado e sigilo. Retornaremos em breve.',
  prevencao: 'Reforçar treinamentos de liderança sobre escuta ativa e canais de denúncia, e revisar periodicamente a carga de trabalho do setor envolvido.',
};

const URGENCIA_UI = {
  alta:  { cor: '#ef4444', bg: 'bg-red-50 border-red-200',    texto: 'text-red-600',    label: 'Urgência alta',  icone: 'Siren' },
  media: { cor: '#f59e0b', bg: 'bg-amber-50 border-amber-200',texto: 'text-amber-600',  label: 'Urgência média', icone: 'AlertTriangle' },
  baixa: { cor: '#10b981', bg: 'bg-emerald-50 border-emerald-200', texto: 'text-emerald-600', label: 'Urgência baixa', icone: 'CheckCircle2' },
};

function SugestoesIA({role, denuncias, mostrarToast }) {
  const [sugestoes, setSugestoes] = useState(() => store.get('ms_sugestoes_ia', {}));
  const [carregando, setCarregando] = useState({});
  if (role !== 'admin') return <AcessoNegado />;

  useEffect(() => store.set('ms_sugestoes_ia', sugestoes), [sugestoes]);

  async function gerarSugestao(denuncia) {
    setCarregando((c) => ({ ...c, [denuncia.id]: true }));
    try {
      const resp = await fetch(GEMINI_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SISTEMA_SUGESTAO_IA }] },
          contents: [{ role: 'user', parts: [{ text: 'Relato da denúncia:\n\n' + denuncia.texto }] }],
          generationConfig: { temperature: 0.4, maxOutputTokens: 700 },
        }),
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const bruto =
        data && data.candidates && data.candidates[0] &&
        data.candidates[0].content && data.candidates[0].content.parts &&
        data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
      if (!bruto) throw new Error('Resposta vazia');

      const limpo = bruto.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(limpo);

      setSugestoes((s) => ({ ...s, [denuncia.id]: parsed }));
      mostrarToast('Sugestão da IA gerada');
    } catch (e) {
      setSugestoes((s) => ({ ...s, [denuncia.id]: SUGESTAO_FALLBACK }));
      mostrarToast('Não foi possível gerar agora — exibindo orientação padrão');
    } finally {
      setCarregando((c) => ({ ...c, [denuncia.id]: false }));
    }
  }

  const pendentes = denuncias.filter((d) => d.status !== 'resolvida');

  return (
    <div className="max-w-4xl">
      <SectionHeader
        icon="Lightbulb"
        eyebrow="Assistente de gestão"
        title="Sugestões de IA para denúncias"
        subtitle="Gere um plano de ação estruturado — urgência, primeiros passos, investigação, comunicação e prevenção — para cada relato recebido pela Escuta Blindada."
      />

      {pendentes.length === 0 && (
        <div className="glass rounded-2xl shadow-glass p-12 text-center fade-up">
          <Icon name="Inbox" size={38} className="text-teal-300 mx-auto mb-3" />
          <h3 className="font-display font-bold text-slate-700 mb-1">Nenhuma denúncia em aberto</h3>
          <p className="text-sm text-slate-500">
            Quando houver relatos pendentes na Escuta Blindada, eles aparecerão aqui para
            você gerar sugestões de resolução com IA.
          </p>
        </div>
      )}

      <div className="space-y-4">
        {pendentes.slice().reverse().map((d) => {
          const sugestao = sugestoes[d.id];
          const loading = !!carregando[d.id];
          const urg = sugestao ? URGENCIA_UI[sugestao.urgencia] || URGENCIA_UI.media : null;

          return (
            <article key={d.id} className="glass rounded-2xl shadow-glass p-5 fade-up">
              <div className="flex items-start justify-between gap-3 flex-wrap">
                <div className="flex items-center gap-2">
                  <span className="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center shrink-0">
                    <Icon name={d.anonima ? 'VenetianMask' : 'User'} size={17} />
                  </span>
                  <p className="text-xs font-semibold uppercase tracking-wider text-slate-500">
                    {d.anonima ? 'Relato anônimo' : d.autor?.nome} · Protocolo #{String(d.id).slice(-6)}
                  </p>
                </div>
                {urg && (
                  <span className={'text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full border ' + urg.bg + ' ' + urg.texto}>
                    {urg.label}
                  </span>
                )}
              </div>

              <p className="text-sm text-slate-600 leading-relaxed mt-3 bg-white/60 border border-slate-100 rounded-2xl p-4">
                {d.texto}
              </p>

              {!sugestao && !loading && (
                <button onClick={() => gerarSugestao(d)}
                  className="mt-4 text-xs font-semibold bg-gradient-to-br from-indigo-500 to-teal-600 hover:from-indigo-400 hover:to-teal-500 text-white rounded-2xl px-4 py-2.5 flex items-center gap-2 transition-all duration-300 ease-in-out hover:-translate-y-0.5">
                  <Icon name="Sparkles" size={14} /> Gerar sugestão com IA
                </button>
              )}

              {loading && (
                <div className="mt-4 flex items-center gap-2 text-slate-500 text-xs">
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block"></span>
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block" style={{ animationDelay: '.2s' }}></span>
                  <span className="typing-dot w-1.5 h-1.5 rounded-full bg-teal-500 inline-block" style={{ animationDelay: '.4s' }}></span>
                  Analisando relato e montando plano de ação...
                </div>
              )}

              {sugestao && (
                <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div className="bg-white/70 border border-slate-100 rounded-2xl p-4 md:col-span-2">
                    <p className="text-xs font-bold uppercase tracking-widest text-teal-600 mb-1.5 flex items-center gap-1.5">
                      <Icon name="FileText" size={13} /> Resumo
                    </p>
                    <p className="text-sm text-slate-700">{sugestao.resumo}</p>
                  </div>

                  <div className="bg-white/70 border border-slate-100 rounded-2xl p-4">
                    <p className="text-xs font-bold uppercase tracking-widest text-teal-600 mb-1.5 flex items-center gap-1.5">
                      <Icon name="ListChecks" size={13} /> Ações imediatas
                    </p>
                    <ul className="text-sm text-slate-700 space-y-1.5 list-disc list-inside">
                      {(sugestao.acoes_imediatas || []).map((a, i) => <li key={i}>{a}</li>)}
                    </ul>
                  </div>

                  <div className="bg-white/70 border border-slate-100 rounded-2xl p-4">
                    <p className="text-xs font-bold uppercase tracking-widest text-teal-600 mb-1.5 flex items-center gap-1.5">
                      <Icon name="Search" size={13} /> Investigação recomendada
                    </p>
                    <p className="text-sm text-slate-700">{sugestao.investigacao}</p>
                  </div>

                  <div className="bg-indigo-50/80 border border-indigo-100 rounded-2xl p-4">
                    <p className="text-xs font-bold uppercase tracking-widest text-indigo-600 mb-1.5 flex items-center gap-1.5">
                      <Icon name="MessageCircle" size={13} /> Comunicação sugerida ao denunciante
                    </p>
                    <p className="text-sm text-indigo-900/90 italic">"{sugestao.comunicacao_sugerida}"</p>
                  </div>

                  <div className="bg-emerald-50/80 border border-emerald-100 rounded-2xl p-4">
                    <p className="text-xs font-bold uppercase tracking-widest text-emerald-600 mb-1.5 flex items-center gap-1.5">
                      <Icon name="ShieldCheck" size={13} /> Prevenção futura
                    </p>
                    <p className="text-sm text-emerald-900/90">{sugestao.prevencao}</p>
                  </div>

                  <button onClick={() => gerarSugestao(d)}
                    className="md:col-span-2 text-xs font-medium text-teal-700 hover:text-teal-500 flex items-center gap-1.5 transition-all duration-300 mt-1">
                    <Icon name="RefreshCw" size={13} /> Gerar novamente
                  </button>
                </div>
              )}
            </article>
          );
        })}
      </div>
    </div>
  );
}

  { id: 'perfil', label: 'Perfil Pessoal', icone: 'User', admin: false },

        (aberta ? 'translate-x-0' : '-translate-x-full')
      }>

          </div>

        <nav className="mt-4 flex-1 overflow-y-auto space-y-1 pr-1">

function BotaoMenu({ item, tab, setTab, fechar, bloqueado, badge }) {
  const ativo = tab === item.id;
  return (
    <button
      onClick={() => { setTab(item.id); fechar(); }}
      className={
        'w-full flex items-center gap-3 rounded-2xl px-3.5 py-2.5 text-sm font-medium transition-all duration-300 ease-in-out ' +
        (ativo
          ? 'bg-gradient-to-r from-teal-500 to-emerald-600 text-white shadow-glow'
          : bloqueado
            ? 'text-slate-400 hover:bg-white/60'
            : 'text-slate-600 hover:bg-white/70 hover:translate-x-1')
      }>
      <Icon name={item.icone} size={18} />
      <span className="flex-1 text-left">{item.label}</span>
      {badge && <span className="bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center">{badge}</span>}
      {bloqueado && <Icon name="Lock" size={13} className="opacity-60" />}
    </button>
  );
}

        </span>
        <button onClick={trocarPerfil}
          className="bg-gradient-to-br from-slate-800 to-slate-900 hover:from-slate-700 hover:to-slate-800 text-white text-xs font-semibold rounded-2xl px-3.5 md:px-4 py-2.5 flex items-center gap-2 transition-all duration-300 ease-in-out hover:-translate-y-0.5 shadow-md">
          <Icon name="Repeat" size={15} />
          <span className="hidden sm:inline">Simular troca de perfil</span>
          <span className="sm:hidden">Trocar</span>
        </button>
      </div>
    </header>
  );
}

/* ============================================================
   APP RAIZ (estado global + persistência)
   ============================================================ */
function App() {
  const [role, setRole] = useState(() => store.get('ms_role', 'colaborador'));
  const [tab, setTab] = useState('zen');
  const [menuAberto, setMenuAberto] = useState(false);
  const [toast, setToast] = useState(null);

  const [denuncias, setDenuncias] = useState(() => store.get('ms_denuncias', []));
  const [chat, setChat] = useState(() => store.get('ms_chat', []));
  const [humores, setHumores] = useState(() => store.get('ms_humores', {}));
  const [clima, setClima] = useState(() => store.get('ms_clima', { respostas: {}, indice: null, enviado: false }));
  const [metas, setMetas] = useState(() => store.get('ms_metas', [
    { titulo: 'Fazer 3 pausas de respiração', feito: 2, total: 3, icone: 'Wind' },
    { titulo: 'Fazer 1 sessão de descompressão', feito: 1, total: 1, icone: 'Headphones' },
    { titulo: 'Registrar humor 5 dias', feito: 3, total: 5, icone: 'SmilePlus' },
    { titulo: 'Concluir 2 aulas do curso', feito: 0, total: 2, icone: 'BookOpen' },
  ]));

  useEffect(() => store.set('ms_role', role), [role]);
  useEffect(() => store.set('ms_denuncias', denuncias), [denuncias]);
  useEffect(() => store.set('ms_chat', chat), [chat]);
  useEffect(() => store.set('ms_humores', humores), [humores]);
  useEffect(() => store.set('ms_clima', clima), [clima]);
  useEffect(() => store.set('ms_metas', metas), [metas]);

  const usuario = USERS[role];
  const pendentes = denuncias.filter((d) => d.status === 'pendente').length;

  function mostrarToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 3200);
  }

  function trocarPerfil() {
    const novo = role === 'colaborador' ? 'admin' : 'colaborador';
    setRole(novo);
    // Ao virar admin, leva direto para a área de gestão; ao voltar, para o Zen
    setTab(novo === 'admin' ? 'dashboard' : 'zen');
    mostrarToast(novo === 'admin'
      ? 'Perfil alterado para Administrador'
      : 'Perfil alterado para Colaborador');
  }

  function addDenuncia(d) {
    setDenuncias((atual) => [...atual, d]);
  }

  return (
    <div className="min-h-screen flex">
      <Sidebar tab={tab} setTab={setTab} role={role} aberta={menuAberto}
        fechar={() => setMenuAberto(false)} pendentes={pendentes} />

      <main className="flex-1 min-w-0 px-4 md:px-8 py-4 md:py-6 lg:ml-0">
        <Header usuario={usuario} role={role} trocarPerfil={trocarPerfil} abrirMenu={() => setMenuAberto(true)} />

        <div key={tab + role} className="fade-up pb-16">
          {tab === 'zen' && <EspacoZen chat={chat} setChat={setChat} />}
          {tab === 'cursos' && <Cursos />}
          {tab === 'escuta' && <EscutaBlindada addDenuncia={addDenuncia} usuario={usuario} mostrarToast={mostrarToast} />}
          {tab === 'clima' && <FormularioClima clima={clima} setClima={setClima} />}
          {tab === 'perfil' && <Perfil usuario={usuario} humores={humores} setHumores={setHumores} metas={metas} setMetas={setMetas} />}
          {tab === 'dashboard' && <DashboardAdmin role={role} />}
          {tab === 'mapa' && <MapaRisco role={role} />}
          {tab === 'denuncias' && <PainelDenuncias role={role} denuncias={denuncias} setDenuncias={setDenuncias} mostrarToast={mostrarToast} />}
          {tab === 'sugestoes' &&  <SugestoesIA role={role} denuncias={denuncias} mostrarToast={mostrarToast} />}
        </div>
      </main>

      <Toast toast={toast} />
    </div>
  );
}

try {
  if (!window.React || !window.ReactDOM) {
    throw new Error('React não carregou. Verifique sua conexão com a internet (os CDNs cdnjs/unpkg precisam estar acessíveis).');
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (erro) {
  window.__msErro(erro.message || String(erro));
}
</script>
</body>
</html>
